name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    # Step 1: Check docs folder exists
    - name: Check docs folder exists
      run: |
        if [ -d "docs" ]; then
          echo "✅ docs folder exists"
        else
          echo "❌ docs folder missing"
          exit 1
        fi
    
    # Step 2: List all files in docs for debugging
    - name: List docs folder contents
      run: |
        echo "📁 Contents of docs folder:"
        ls -la docs/
    
    # Step 3: Check for ERD file (multiple possible names)
    - name: Check ERD file exists
      run: |
        echo "🔍 Checking for ERD file..."
        if [ -f "docs/Saction A ERD.png" ]; then
          echo "✅ Found ERD: Saction A ERD.png"
        elif [ -f "docs/erd.png" ]; then
          echo "✅ Found ERD: erd.png"
        elif [ -f "docs/ERD.png" ]; then
          echo "✅ Found ERD: ERD.png"
        elif [ -f "docs/*ERD*.png" ]; then
          echo "✅ Found ERD file"
        else
          echo "❌ No ERD file found!"
          echo "   Looking for: Saction A ERD.png, erd.png, ERD.png"
          echo "   Files in docs:"
          ls -la docs/*.png 2>/dev/null || echo "   No PNG files found"
          exit 1
        fi
    
    # Step 4: Check SQL file (multiple possible names)
    - name: Check SQL file exists
      run: |
        echo "🔍 Checking for SQL file..."
        if [ -f "docs/wkrhzjvn.sql" ]; then
          echo "✅ Found SQL file: wkrhzjvn.sql"
        elif [ -f "docs/raceday-schema.sql" ]; then
          echo "✅ Found SQL file: raceday-schema.sql"
        elif [ -f "docs/*.sql" ]; then
          echo "✅ Found SQL file"
        else
          echo "❌ No SQL file found!"
          echo "   Looking for: wkrhzjvn.sql, raceday-schema.sql, *.sql"
          echo "   Files in docs:"
          ls -la docs/*.sql 2>/dev/null || echo "   No SQL files found"
          exit 1
        fi
    
    # Step 5: Check endpoint plan file (multiple possible names)
    - name: Check endpoint plan exists
      run: |
        echo "🔍 Checking for endpoint plan..."
        if [ -f "docs/Endpoint-plan.md" ]; then
          echo "✅ Found endpoint plan: Endpoint-plan.md"
        elif [ -f "docs/endpoint-plan.md" ]; then
          echo "✅ Found endpoint plan: endpoint-plan.md"
        elif [ -f "docs/Prog API.pdf" ]; then
          echo "✅ Found API document: Prog API.pdf"
        elif [ -f "docs/*plan*.md" ]; then
          echo "✅ Found endpoint plan"
        else
          echo "❌ No endpoint plan found!"
          echo "   Looking for: Endpoint-plan.md, endpoint-plan.md, Prog API.pdf"
          echo "   Files in docs:"
          ls -la docs/*.md 2>/dev/null || echo "   No MD files found"
          exit 1
        fi
    
    # Step 6: Validate SQL file content (if found)
    - name: Validate SQL file content
      run: |
        echo "🔍 Validating SQL file..."
        
        # Find the SQL file
        SQL_FILE=""
        if [ -f "docs/wkrhzjvn.sql" ]; then
          SQL_FILE="docs/wkrhzjvn.sql"
        elif [ -f "docs/raceday-schema.sql" ]; then
          SQL_FILE="docs/raceday-schema.sql"
        elif ls docs/*.sql 1> /dev/null 2>&1; then
          SQL_FILE=$(ls docs/*.sql | head -1)
        fi
        
        if [ -n "$SQL_FILE" ]; then
          echo "📄 Validating: $SQL_FILE"
          
          if grep -q "CREATE TABLE" "$SQL_FILE"; then
            echo "✅ SQL contains CREATE TABLE statements"
          else
            echo "❌ SQL missing CREATE TABLE statements"
            exit 1
          fi
          
          if grep -q "INSERT INTO" "$SQL_FILE"; then
            echo "✅ SQL contains INSERT statements"
          else
            echo "❌ SQL missing INSERT statements"
            exit 1
          fi
          
          if grep -q "FOREIGN KEY" "$SQL_FILE"; then
            echo "✅ SQL contains FOREIGN KEY constraints"
          else
            echo "⚠️  SQL missing FOREIGN KEY constraints (optional)"
          fi
          
          # Count tables
          table_count=$(grep -c "CREATE TABLE" "$SQL_FILE")
          echo "   Found $table_count tables in SQL file"
        else
          echo "❌ No SQL file found to validate"
          exit 1
        fi
    
    # Step 7: Validate ERD file
    - name: Validate ERD file
      run: |
        echo "🔍 Validating ERD file..."
        
        ERD_FILE=""
        if [ -f "docs/Saction A ERD.png" ]; then
          ERD_FILE="docs/Saction A ERD.png"
        elif [ -f "docs/erd.png" ]; then
          ERD_FILE="docs/erd.png"
        elif [ -f "docs/ERD.png" ]; then
          ERD_FILE="docs/ERD.png"
        elif ls docs/*ERD*.png 1> /dev/null 2>&1; then
          ERD_FILE=$(ls docs/*ERD*.png | head -1)
        elif ls docs/*.png 1> /dev/null 2>&1; then
          ERD_FILE=$(ls docs/*.png | head -1)
        fi
        
        if [ -n "$ERD_FILE" ]; then
          echo "✅ Found ERD file: $ERD_FILE"
          
          # Check file size
          size=$(stat -c%s "$ERD_FILE" 2>/dev/null || stat -f%z "$ERD_FILE" 2>/dev/null)
          if [ "$size" -gt 0 ]; then
            echo "✅ File has content ($size bytes)"
          else
            echo "❌ File is empty"
            exit 1
          fi
          
          # Check if it's a PNG
          if file "$ERD_FILE" | grep -q "PNG"; then
            echo "✅ File is a valid PNG image"
          else
            echo "⚠️  File may not be a PNG (type: $(file "$ERD_FILE"))"
          fi
        else
          echo "❌ No ERD file found!"
          exit 1
        fi
    
    # Step 8: Validate endpoint plan
    - name: Validate endpoint plan
      run: |
        echo "🔍 Validating endpoint plan..."
        
        PLAN_FILE=""
        if [ -f "docs/Endpoint-plan.md" ]; then
          PLAN_FILE="docs/Endpoint-plan.md"
        elif [ -f "docs/endpoint-plan.md" ]; then
          PLAN_FILE="docs/endpoint-plan.md"
        elif [ -f "docs/Prog API.pdf" ]; then
          PLAN_FILE="docs/Prog API.pdf"
          echo "📄 Found API document as PDF: Prog API.pdf"
          echo "✅ API documentation exists"
          exit 0
        elif ls docs/*plan*.md 1> /dev/null 2>&1; then
          PLAN_FILE=$(ls docs/*plan*.md | head -1)
        fi
        
        if [ -n "$PLAN_FILE" ]; then
          echo "✅ Found endpoint plan: $PLAN_FILE"
          
          # For markdown files, check content
          if [[ "$PLAN_FILE" == *.md ]]; then
            if grep -q "HTTP" "$PLAN_FILE" || grep -q "GET\|POST\|PUT\|DELETE" "$PLAN_FILE"; then
              echo "✅ Endpoint plan contains HTTP methods"
            else
              echo "⚠️  Endpoint plan may be missing HTTP methods"
            fi
            
            if grep -q "Route" "$PLAN_FILE" || grep -q "Endpoint" "$PLAN_FILE"; then
              echo "✅ Endpoint plan contains routes"
            else
              echo "⚠️  Endpoint plan may be missing routes"
            fi
          else
            echo "📄 File is not a markdown file, skipping content validation"
          fi
        else
          echo "❌ No endpoint plan found!"
          echo "   Looking for: Endpoint-plan.md, endpoint-plan.md, Prog API.pdf"
          exit 1
        fi
    
    # Step 9: Check for README files
    - name: Check README files
      run: |
        echo "🔍 Checking README files..."
        
        if [ -f "README.md" ]; then
          echo "✅ Root README.md exists"
          
          # Check for role descriptions
          if grep -q "Organiser" README.md || grep -q "Organizer" README.md; then
            echo "✅ README contains Organiser role"
          else
            echo "⚠️  README missing Organiser role description"
          fi
          
          if grep -q "Participant" README.md; then
            echo "✅ README contains Participant role"
          else
            echo "⚠️  README missing Participant role description"
          fi
        else
          echo "❌ No README.md found in root directory"
          exit 1
        fi
        
        if [ -f "docs/README" ] || [ -f "docs/README.md" ]; then
          echo "✅ docs/README exists"
        else
          echo "⚠️  docs/README file not found"
        fi
    
    # Step 10: Verify commit count (minimum 20)
    - name: Verify commit count
      run: |
        echo "🔍 Checking commit count..."
        commit_count=$(git rev-list --count HEAD)
        echo "   Total commits: $commit_count"
        
        if [ $commit_count -ge 20 ]; then
          echo "✅ Repository has $commit_count commits (minimum 20 met)"
        else
          echo "❌ Repository has only $commit_count commits (minimum 20 required)"
          echo "   Need $((20 - commit_count)) more commits"
          exit 1
        fi
    
    # Step 11: Check file naming consistency
    - name: Check file naming consistency
      run: |
        echo "🔍 Checking file naming..."
        
        # Check for common naming issues
        if [ -f "docs/Saction A ERD.png" ]; then
          echo "📝 Note: ERD file is named 'Saction A ERD.png' (spelling: Saction vs Section)"
          echo "   This is fine, but consider renaming to 'erd.png' for consistency"
        fi
        
        if ls docs/*.sql 1> /dev/null 2>&1; then
          echo "✅ SQL file present"
        fi
        
        # Check for PDF files
        if [ -f "docs/Prog API.pdf" ]; then
          echo "📄 Found PDF: Prog API.pdf"
        fi
    
    # Step 12: Final summary
    - name: Validation Summary
      if: success()
      run: |
        echo "🎉 All validations passed successfully!"
        echo ""
        echo "📊 Summary:"
        echo "   ✅ docs folder exists"
        
        # List what was found
        if [ -f "docs/Saction A ERD.png" ]; then
          echo "   ✅ ERD: Saction A ERD.png"
        elif [ -f "docs/erd.png" ]; then
          echo "   ✅ ERD: erd.png"
        fi
        
        if [ -f "docs/wkrhzjvn.sql" ]; then
          echo "   ✅ SQL: wkrhzjvn.sql"
        elif [ -f "docs/raceday-schema.sql" ]; then
          echo "   ✅ SQL: raceday-schema.sql"
        fi
        
        if [ -f "docs/Endpoint-plan.md" ]; then
          echo "   ✅ Endpoint Plan: Endpoint-plan.md"
        elif [ -f "docs/Prog API.pdf" ]; then
          echo "   ✅ API Documentation: Prog API.pdf"
        fi
        
        echo "   ✅ Commit count: $(git rev-list --count HEAD) (20+ met)"
        echo ""
        echo "🚀 Repository is ready for submission!"
    
    - name: Validation Failed
      if: failure()
      run: |
        echo "❌ Validation failed!"
        echo "Please fix the issues above and try again."
        echo ""
        echo "🔧 Required files:"
        echo "   - ERD file (Saction A ERD.png or erd.png)"
        echo "   - SQL file (wkrhzjvn.sql or raceday-schema.sql)"
        echo "   - Endpoint plan (Endpoint-plan.md or Prog API.pdf)"
        echo "   - README.md in root directory"
        exit 1
